name: Application Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'application-service/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: application-service
  REGISTRY: ghcr.io

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/application-service:${{ github.run_number }} \
            ./application-service

      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/application-service:${{ github.run_number }}

      - name: Update Manifest
        run: |
          sed -i \
            "s|image:.*|image: ghcr.io/${{ github.repository_owner }}/application-service:${{ github.run_number }}|g" \
            k8s/application-service/deployment.yaml

      - name: Commit Manifest
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add k8s/application-service/deployment.yaml

          git commit -m "Update application-service image to ${{ github.run_number }}" || exit 0

          git push
