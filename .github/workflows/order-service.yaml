name: Order Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'order-service/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Maven Build
        run: |
          cd order-service
          mvn clean package

      - name: Login to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/order-service:${{ github.run_number }} \
            -f order-service/Dockerfile \
            order-service

      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/order-service:${{ github.run_number }}

      - name: Update Manifest
        run: |
          sed -i \
            "s#image:.*#image: ghcr.io/${{ github.repository_owner }}/order-service:${{ github.run_number }}#" \
            k8s/order-service/deployment.yaml

      - name: Commit Manifest
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add k8s/order-service/deployment.yaml

          git commit -m "Update order-service image ${{ github.run_number }}" || exit 0

          git push
