name: Test OpenShift Auth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      - name: Authenticate to OpenShift Sandbox
        run: |
          oc login "${{ secrets.OS_SERVER }}" \
            --token="${{ secrets.OS_TOKEN }}" \
            --insecure-skip-tls-verify=true

      - name: Set OpenShift project
        run: |
          oc project organicgreentea-dev

      - name: Verify OpenShift Authentication
        run: |
          oc whoami

      - name: Verify OpenShift Server
        run: |
          oc whoami --show-server

      - name: Verify OpenShift Project
        run: |
          oc project

      - name: Verify Application Resources
        run: |
          oc get deployments
          oc get services
          oc get pods
