apiVersion: apps/v1
kind: Deployment

metadata:
  name: patient-service
  namespace: organicgreentea-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: patient-service

  template:
    metadata:
      labels:
        app: patient-service

    spec:
      containers:
        - name: patient-service

          image: ghcr.io/emailvpreferences/application-service/patient-service

          imagePullPolicy: Always

          ports:
            - containerPort: 3000
