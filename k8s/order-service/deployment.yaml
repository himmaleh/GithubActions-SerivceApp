apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: organicgreentea-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: ghcr.io/emailvpreferences/order-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
