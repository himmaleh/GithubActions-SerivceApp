apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-service
  namespace: organicgreentea-dev
  labels:
    app: application-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: application-service

  template:
    metadata:
      labels:
        app: application-service

    spec:
      containers:
        - name: application-service

          image: ghcr.io/himmaleh/application-service:2

          imagePullPolicy: Always

          ports:
            - containerPort: 3001
